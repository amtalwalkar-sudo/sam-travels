name: Sam Travels CI
on:
  pull_request:
  push:
    branches: [main, foundation/native-android-architecture, 'phase-*/*']
concurrency:
  group: sam-travels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Enforce architecture boundaries
        run: npm run check:architecture
      - name: Enforce Stage 5 privacy, trace, platform and impact contracts
        run: npm run check:stage5
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Gate Stage 3 cross-feature data coordination and calculation provenance
        run: npm test -- tests/cross-feature-data-coordinator.test.ts tests/feature-contracts.test.ts tests/feature-extension.test.ts
      - name: Gate deterministic feature activation and contribution isolation
        run: npm test -- tests/feature-activation.test.ts tests/feature-contracts.test.ts tests/feature-extension.test.ts tests/feature-lifecycle-coordinator.test.ts
      - name: Gate offline workflow and backup reliability regressions
        run: npm test -- tests/driver-workflow.test.ts tests/driver-workflow-parity.test.ts tests/backup-snapshot.test.ts tests/backup-restore-failure-recovery.test.ts tests/recovery-lifecycle.test.ts tests/transaction-recovery-guarantees.test.ts tests/native-backup-v2-interoperability.test.ts tests/local-diagnostics.test.ts
      - name: Run complete web regression suite
        run: npm test
      - name: Publish Dexie-generated complete Timeline parity oracle
        uses: actions/upload-artifact@v4
        with:
          name: timeline-projection-parity-oracle-v1
          path: android/app/src/androidTest/assets/generated/timeline-projection-parity-oracle-v1.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run build
  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run cap:sync
      - name: Build the shared headless Timeline projection for Android parity tests
        run: npm run build:timeline-parity
      - name: Stage the shared workflow parity contract for Android tests
        run: mkdir -p android/app/src/androidTest/assets && cp tests/fixtures/driver-workflow-parity-v1.json android/app/src/androidTest/assets/driver-workflow-parity-v1.json
      - name: Download the exact Dexie projection oracle for Android comparison
        uses: actions/download-artifact@v4
        with:
          name: timeline-projection-parity-oracle-v1
          path: android/app/src/androidTest/assets/generated
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle -p android assembleDebug assembleDebugAndroidTest testDebugUnitTest assembleRelease
      - name: Publish generated Room schema history
        uses: actions/upload-artifact@v4
        with:
          name: sam-travels-room-schema-export
          path: android/app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Required Android Room, workflow coordination, and backup reliability gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          script: gradle -p android connectedDebugAndroidTest
      - name: Publish unsigned release APK from merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sam-travels-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  integrated-regression:
    name: Integrated regression gate
    if: always()
    needs: [architecture, web, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every architecture, web, and Android gate
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          WEB_RESULT: ${{ needs.web.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$ARCHITECTURE_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
