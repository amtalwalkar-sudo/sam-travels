name: Sam Travels CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, foundation/native-android-architecture, 'phase-*/*', fix/performance-calculation-contract-v1]
concurrency:
  group: sam-travels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Enforce architecture boundaries
        run: npm run check:architecture
      - name: Enforce Stage 5 privacy, trace, platform and impact contracts
        run: npm run check:stage5
  web:
    runs-on: ubuntu-24.04
    env:
      VITE_GEOAPIFY_PROXY_URL: https://sam-travels.amtalwalkar.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate local Markdown documentation links
        run: npm run check:docs
      - name: Gate Stage 3 cross-feature data coordination and calculation provenance
        run: npm test -- tests/cross-feature-data-coordinator.test.ts tests/feature-contracts.test.ts tests/feature-extension.test.ts
      - name: Gate deterministic feature activation and contribution isolation
        run: npm test -- tests/feature-activation.test.ts tests/feature-contracts.test.ts tests/feature-extension.test.ts tests/feature-lifecycle-coordinator.test.ts
      - name: Gate offline workflow and backup reliability regressions
        run: npm test -- tests/driver-workflow.test.ts tests/driver-workflow-parity.test.ts tests/backup-snapshot.test.ts tests/backup-restore-failure-recovery.test.ts tests/recovery-lifecycle.test.ts tests/transaction-recovery-guarantees.test.ts tests/native-backup-v2-interoperability.test.ts tests/local-diagnostics.test.ts
      - name: Run local geocoder contract tests (no production dependency)
        run: npm run test:geocoder
      - name: Run complete web regression suite
        run: npm test
      - name: Publish Dexie-generated complete Timeline parity oracle
        uses: actions/upload-artifact@v4
        with:
          name: timeline-projection-parity-oracle-v1
          path: android/app/src/androidTest/assets/generated/timeline-projection-parity-oracle-v1.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run build
      - name: Install headless Chromium for rendered PWA acceptance
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify PWA service-worker cache boundaries and rollback retention
        run: node scripts/pwa-service-worker-contract.mjs
      - name: Submit and verify Maintenance correction through the rendered PWA
        run: node scripts/maintenance-correction-browser-acceptance.mjs
      - name: Verify fleet Compliance overview and overlap review through the rendered PWA
        run: node scripts/compliance-overview-browser-acceptance.mjs
      - name: Verify all six replacement Admin sections through the rendered PWA
        run: node scripts/admin-workspace-browser-acceptance.mjs
      - name: Verify Admin form workflows through the rendered PWA
        run: node scripts/admin-form-browser-acceptance.mjs
      - name: Verify Performance calculations and dashboard end to end through the rendered PWA
        run: node scripts/performance-screen-browser-acceptance.mjs
  geocoder-production:
    name: Production geocoder verification
    runs-on: ubuntu-24.04
    needs: [architecture, web, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for the Cloudflare main-branch deployment and verify the live geocoder
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://sam-travels.amtalwalkar.workers.dev/reverse-geocode";
          let lastError = "no response";
          // Cloudflare Workers Builds deploys the main commit independently of GitHub Actions.
          // Retry for up to three minutes so this check validates the newly deployed version,
          // rather than racing the deployment or silently testing the previous production version.
          for (let attempt = 0; attempt < 18; attempt += 1) {
            try {
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  Origin: "https://localhost",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ latitude: 19.076, longitude: 72.8777 }),
                signal: AbortSignal.timeout(15000),
              });
              const body = await response.json().catch(() => ({}));
              if (response.ok && typeof body.label === "string" && body.label.trim()) {
                if (response.headers.get("Access-Control-Allow-Origin") !== "https://localhost") {
                  throw new Error("production geocoder CORS response did not allow the Android WebView origin");
                }
                console.log("Production geocoder returned a locality label:", body.label);
                process.exit(0);
              }
              lastError = `HTTP ${response.status}: ${JSON.stringify(body)}`;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }
            if (attempt < 17) await new Promise(resolve => setTimeout(resolve, 10000));
          }
          console.error("Production geocoder smoke test failed after deployment wait:", lastError);
          process.exit(1);
          NODE
  android:
    needs: web
    # Ubuntu 22.04 hosted images include the PulseAudio runtime required by the emulator.
    # Keep the Android gate independent of apt mirror availability on Ubuntu 24.04.
    runs-on: ubuntu-22.04
    env:
      VITE_GEOAPIFY_PROXY_URL: https://sam-travels.amtalwalkar.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run cap:sync
      - name: Build the shared headless Timeline projection for Android parity tests
        run: npm run build:timeline-parity
      - name: Build the shared Full-cost Work-distance projection for Android parity tests
        run: npm run build:full-cost-distance-parity
      - name: Stage the shared workflow parity contract for Android tests
        run: mkdir -p android/app/src/androidTest/assets && cp tests/fixtures/driver-workflow-parity-v1.json android/app/src/androidTest/assets/driver-workflow-parity-v1.json
      - name: Stage the shared semantic backup lifecycle fixture for Android tests
        run: cp fixtures/semantic-backup-lifecycle-v1.json android/app/src/androidTest/assets/semantic-backup-lifecycle-v1.json
      - name: Download the exact Dexie projection oracle for Android comparison
        uses: actions/download-artifact@v4
        with:
          name: timeline-projection-parity-oracle-v1
          path: android/app/src/androidTest/assets/generated
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle -p android assembleDebug assembleDebugAndroidTest testDebugUnitTest assembleRelease
      - name: Publish installable debug-signed APK for phone testing
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: sam-travels-installable-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Run focused Android GPS lifecycle threading contract test
        run: gradle -p android :app:testDebugUnitTest --tests 'in.samtravels.app.KotlinArchitectureBoundaryTest.overlayLocationRequestLifecycleIsConfinedToMainThread'
      - name: Publish generated Room schema history
        uses: actions/upload-artifact@v4
        with:
          name: sam-travels-room-schema-export
          path: android/app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensure Android Emulator host runtime dependency
        run: |
          set -euo pipefail
          # The Ubuntu 22.04 runner image normally includes libpulse0. Avoid
          # contacting an apt mirror unless the emulator runtime is genuinely absent.
          if ldconfig -p | grep -Fq 'libpulse.so.0'; then
            echo "Android Emulator PulseAudio runtime is already available"
            exit 0
          fi
          source_list="$(mktemp)"
          trap 'rm -f "$source_list"' EXIT
          echo "deb [arch=amd64] https://archive.ubuntu.com/ubuntu jammy main universe" > "$source_list"
          sudo apt-get \
            -o Dir::Etc::sourcelist="$source_list" \
            -o Dir::Etc::sourceparts="-" \
            -o Acquire::Retries=3 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::http::Timeout=20 update
          sudo apt-get \
            -o Dir::Etc::sourcelist="$source_list" \
            -o Dir::Etc::sourceparts="-" \
            -o Acquire::Retries=3 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::http::Timeout=20 install -y libpulse0
          ldconfig -p | grep -Fq 'libpulse.so.0'
      - name: Install and verify Android Emulator SDK package
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install emulator --channel=0 && test -x "$ANDROID_HOME/emulator/emulator" && "$ANDROID_HOME/emulator/emulator" -version; then
              exit 0
            fi
            echo "Android Emulator SDK install attempt $attempt failed; clearing partial package before retry" >&2
            rm -rf "$ANDROID_HOME/emulator"
            sleep $((attempt * 10))
          done
          echo "Android Emulator SDK package could not be installed and verified after 3 attempts" >&2
          exit 1
      - name: Required Android Room, workflow coordination, and backup reliability gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            bash -euo pipefail -c 'echo "Run Performance browser/Room shared-fixture parity on the provisioned emulator"; gradle -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=in.samtravels.app.PerformanceCalculationRoomParityTest; echo "Run shared active-driving-day PWA/Room parity"; gradle -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=in.samtravels.app.PerformanceActiveDrivingDayRoomParityTest; echo "Install target and instrumentation APKs before restart phases"; gradle -p android :app:installDebug :app:installDebugAndroidTest; adb -s emulator-5554 shell pm path in.samtravels.app; adb -s emulator-5554 shell pm path in.samtravels.app.test; echo "Prepare durable Room state in a direct instrumentation invocation"; output="$(adb -s emulator-5554 shell am instrument -w -e class "in.samtravels.app.DriverWorkflowProcessRestartTest#preparePendingWorkflowForProcessRestart" in.samtravels.app.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"; printf "%s\\n" "$output"; case "$output" in *"OK (1 test)"*) ;; *) echo "Preparation instrumentation did not report one passing test" >&2; exit 1 ;; esac; case "$output" in *"FAILURES!!!"*) echo "Preparation instrumentation reported failures" >&2; exit 1 ;; esac; echo "Force-stop target and instrumentation packages to prove process restart"; adb -s emulator-5554 shell am force-stop in.samtravels.app; adb -s emulator-5554 shell am force-stop in.samtravels.app.test; echo "Recover pending workflow in a separate instrumentation invocation"; output="$(adb -s emulator-5554 shell am instrument -w -e class "in.samtravels.app.DriverWorkflowProcessRestartTest#recoverPendingWorkflowAfterProcessRestart" in.samtravels.app.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"; printf "%s\\n" "$output"; case "$output" in *"OK (1 test)"*) ;; *) echo "Recovery instrumentation did not report one passing test" >&2; exit 1 ;; esac; case "$output" in *"FAILURES!!!"*) echo "Recovery instrumentation reported failures" >&2; exit 1 ;; esac; echo "Run remaining Android instrumentation suite excluding special cases"; gradle -p android connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=in.samtravels.app.DriverWorkflowProcessRestartTest,in.samtravels.app.PerformanceCalculationRoomParityTest,in.samtravels.app.PerformanceActiveDrivingDayRoomParityTest'
      - name: Build update-compatible signed APK from merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          test -s "$RUNNER_TEMP/android-signing/release.jks"
          git fetch --force --tags
          latest="$(git tag --list 'android-v[0-9]*' | sed 's/^android-v//' | awk '/^[0-9]+$/ { if ($1 > max) max=$1 } END { print max+0 }')"
          VERSION_CODE=$((latest + 1))
          VERSION_NAME="0.${VERSION_CODE}.0"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/android-signing/release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          gradle -p android :app:assembleRelease -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='in.samtravels.app' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          sha256sum "$APK" | tee "$RUNNER_TEMP/android-signing/apk-sha256.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "android-v$VERSION_CODE" -m "Sam Travels Android $VERSION_NAME (versionCode $VERSION_CODE)"
          git push origin "android-v$VERSION_CODE"
      - name: Publish update-compatible signed APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sam-travels-update-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/android-signing/apk-sha256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary Android signing material
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf "$RUNNER_TEMP/android-signing"
      - name: Publish unsigned release APK from merged main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sam-travels-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  integrated-regression:
    name: Integrated regression gate
    if: always()
    needs: [architecture, web, geocoder-production, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Require PR checks and, on main, the post-deployment production geocoder check
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          WEB_RESULT: ${{ needs.web.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          GEOCODER_RESULT: ${{ needs.geocoder-production.result }}
          REQUIRE_PRODUCTION_GEOCODER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          test "$ARCHITECTURE_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
          if [ "$REQUIRE_PRODUCTION_GEOCODER" = "true" ]; then
            test "$GEOCODER_RESULT" = "success"
          else
            test "$GEOCODER_RESULT" = "skipped"
          fi
