<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="970" viewBox="0 0 1230 970" role="img" aria-labelledby="title desc">
<title id="title">Sam Travels Timeline — proposed layered driver-first direction v2</title>
<desc id="desc">Three mobile screen states show day overview, week overview, and progressive ride details. This is a proposal for user review, not an approved implementation reference.</desc>
<defs>
 <style>
 text{font-family:Inter,Arial,sans-serif}.bg{fill:#101820}.surface{fill:#1B2A36;stroke:#496174;stroke-width:1}.surface2{fill:#263746}.muted{fill:#AAB8C4}.white{fill:#FFFFFF}.blue{fill:#65B9E8}.line{stroke:#52758B;stroke-width:2.5;stroke-linecap:round}.green{fill:#91E0BD}.amber{fill:#F0C79A}.phone{fill:#101820;stroke:#526575;stroke-width:2}
 </style>
</defs>
<rect width="1230" height="970" fill="#0B1218"/>
<text x="24" y="30" fill="#FFFFFF" font-size="18" font-weight="750">SAM TRAVELS · TIMELINE V2</text>
<text x="24" y="52" fill="#AAB8C4" font-size="11">PROPOSED VISUAL REFERENCE · FOR USER APPROVAL · NOT YET AUTHORITATIVE</text>

