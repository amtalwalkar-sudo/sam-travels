name = "sam-travels-geocoder"
main = "src/index.ts"
compatibility_date = "2026-11-07"
workers_dev = true

[vars]
# Replace with the exact deployed PWA origin(s), comma-separated.
# The Capacitor Android WebView origin is https://localhost.
ALLOWED_ORIGINS = "https://localhost,http://localhost:5173"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "912345678901"
simple = { limit = 30, period = 60 }
